<!DOCTYPE html>
<html lang="en" class="fx-boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gustaf edén{% endblock title %}</title>
<meta name="description" content="{% block description %}Gustaf Edén — embedded application developer. Photographs and personal projects.{% endblock description %}">
<meta property="og:title" content="{% block og_title %}gustaf edén{% endblock og_title %}">
<meta property="og:description" content="{% block og_description %}Gustaf Edén — embedded application developer. Photographs and personal projects.{% endblock og_description %}">
<meta property="og:url" content="{% block og_url %}{{ config.base_url }}/{% endblock og_url %}">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Red+Hat+Text:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>html.fx-boot body { visibility: hidden; }</style>
<noscript><style>html.fx-boot body { visibility: visible; }</style></noscript>
<script>
// safety valve (task 6): if boot() never removes fx-boot (JS error, slow network, FX stuck),
// never leave the page permanently invisible.
setTimeout(function () { document.documentElement.classList.remove('fx-boot'); }, 2500);
</script>
</head>
<body>

{% block main %}{% endblock main %}

<!-- ================= photo viewer (overlay, not a page) ================= -->
<div class="viewer" id="viewer" role="dialog" aria-label="photo viewer" data-fx-glass>
  <button class="vclose" id="v-close" type="button" aria-label="close viewer">close</button>
  <div class="stage">
    <img id="v-img" alt="">
    <div class="nav l" data-step="-1"></div><div class="nav r" data-step="1"></div>
  </div>
  <aside>
    <div class="count" id="v-count"></div>
    <div class="coll" id="v-coll"></div>
    <div id="v-exif"></div>
    <div class="vfoot">
      <a id="v-orig" href="#" target="_blank" rel="noopener">open full size</a>
      <a href="#" id="v-link">copy link to this frame</a>
      <div class="k"><kbd>esc</kbd>close <kbd>i</kbd>hide panel</div>
    </div>
  </aside>
</div>

{% include "partials/fx-settings.html" %}

<!-- fx stub: used only if fx.js hasn't loaded (standalone testing / fx.js not shipped yet).
     Gives every page a working, instant-swap experience with the same window.FX API. -->
<script>
if (!window.FX) {
  function __stubPaintRules() {
    document.querySelectorAll('[data-rule]').forEach(function (r) {
      if (!r.hasChildNodes()) r.style.background = 'var(--border)';
    });
  }
  window.FX = {
    lite: true,
    __isStub: true,
    init: function () { return Promise.resolve(); },
    show: function (pageEl) { __stubPaintRules(); },
    coldStart: function (pageEl) { __stubPaintRules(); return Promise.resolve(); },
    transition: function (fromEl, toEl, swap) {
      return Promise.resolve(swap()).then(function () { __stubPaintRules(); });
    },
    refresh: function (pageEl) { __stubPaintRules(); },
    develop: function (imgEl) {},
    frame: function (imgEl, src) {
      if (!src) return Promise.resolve();
      imgEl.src = src;
      return imgEl.decode ? imgEl.decode().catch(function () {}) : Promise.resolve();
    },
  };
}
</script>

<script src="/photos.js"></script>
<script src="/fx.js"></script>
<script src="/stats.js"></script>
<script src="/site.js"></script>
</body>
</html>
